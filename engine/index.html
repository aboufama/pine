<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pine Engine</title>
<meta name="description" content="Pine's data engine on one page: public mocap retargeted onto a full-size humanoid, pretrained, and measured.">
<meta property="og:title" content="Pine Engine">
<meta property="og:description" content="Human movement in. Humanoid motion out. Every finding of the first run on one page.">
<link rel="icon" href="../mark-c2.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* A paper's first page: title and abstract, then one figure of eight panels that carries every result. */
:root {
  --ink: #1d1d1f; --ink2: #424245; --quiet: #6e6e73; --faint: #86868b; --ghost: #c7c7cc;
  --hair: #d2d2d7; --wash: #f5f5f7; --paper: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, monospace;
  --gl: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45;
  letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--ghost); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }
.page { max-width: 1440px; margin: 0 auto; padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: var(--gl); padding-right: var(--gr); display: grid; gap: 14px; }

.top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--quiet); }
.top svg { width: 17px; height: auto; display: block; }
.top b { color: var(--ink); font-weight: 600; }
.top .sp { flex: 1; }

header { display: block; }
header > * { min-width: 0; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 3vw, 44px); line-height: 1.05; letter-spacing: -0.035em; margin: 2px 0 10px; text-wrap: balance; }
.abs { margin: 0; color: var(--ink2); font-size: 15px; max-width: 64em; text-wrap: pretty; }
.abs b { color: var(--ink); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; }
.stats div { display: flex; align-items: baseline; gap: 6px; }
.stats b { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
.stats span { color: var(--quiet); font-size: 13px; }
.film { position: relative; border-radius: 14px; overflow: hidden; background: #0e1512 url("../poster.jpg") center / cover; aspect-ratio: 16 / 9; cursor: pointer; align-self: start; width: 100%; }
.film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.film span { position: absolute; left: 12px; bottom: 10px; color: rgba(255,255,255,.86); font-size: 12px; }
.film:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.side { background: var(--wash); border-radius: 18px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side .k { display: flex; gap: 8px; align-items: baseline; }
.side .k span { margin-left: auto; color: var(--quiet); font-weight: 400; }
.side h3 { font-size: 18px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--paper); background: var(--ink); border-radius: 980px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.stage { position: relative; height: 330px; border-radius: 12px; background: var(--paper); overflow: hidden; cursor: pointer; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.traces { height: 96px; }
.traces svg { width: 100%; height: 100%; display: block; overflow: visible; }
.traces text { font-family: var(--mono); font-size: 10px; fill: var(--quiet); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 12px; border: 1px solid var(--hair); background: var(--paper); color: var(--ink); border-radius: 980px; padding: 4px 11px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips button:focus-visible, .stage:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#robot3d .stage { height: 446px; }
.fig { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.panel { background: var(--wash); border-radius: 14px; padding: 13px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.panel header { display: block; }
.k { font-size: 12px; font-weight: 600; color: var(--faint); letter-spacing: 0; }
.k i { font-style: normal; color: var(--ink); margin-right: 6px; }
h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; margin: 0; text-wrap: balance; }
.viz { position: relative; height: 172px; min-width: 0; }
.viz canvas { width: 100%; height: 100%; display: block; }
.cap { font-size: 12px; line-height: 1.4; color: var(--quiet); margin: 0; text-wrap: pretty; }
.cap b { color: var(--ink); font-weight: 600; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 10px; fill: var(--quiet); letter-spacing: 0; }
.chart .lbl { font-family: var(--sans); font-size: 11px; fill: var(--ink2); }

.mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; height: 100%; }
.mini canvas { background: var(--paper); border-radius: 8px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; height: 100%; }
.trio canvas { background: var(--paper); border-radius: 8px; cursor: pointer; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 10px; height: 100%; align-items: center; }
.duo canvas { background: var(--paper); border-radius: 8px; height: 100%; cursor: pointer; }
.big { font-family: var(--display); font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.big small { font-size: 12px; color: var(--quiet); font-weight: 400; letter-spacing: 0; margin-left: 4px; }
.dim { color: var(--faint); }
.stack { display: grid; gap: 10px; }
.stack span { display: block; font-size: 11.5px; color: var(--quiet); margin-top: 3px; }

.bars { display: grid; gap: 5px; align-content: center; height: 100%; }
.labels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; height: 100%; align-content: center; }
.labels h4 { font-size: 11px; font-weight: 600; color: var(--faint); margin: 0 0 4px; }
.labels ul { list-style: none; margin: 0; padding: 0; font-size: 11.5px; line-height: 1.5; color: var(--ink2); }
.labels .big { font-size: 26px; }
.brow { display: grid; grid-template-columns: minmax(0, 8.6em) minmax(0, 1fr) 4.6em; gap: 8px; align-items: center; font-size: 11.5px; }
.brow > div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .t { height: 13px; background: var(--paper); border-radius: 4px; position: relative; overflow: hidden; }
.brow .t span { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 4px; }
.brow .t span.light { background: var(--faint); }
.brow .t span.ghost { background: var(--ghost); }
.brow .v { text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--ink2); }
.brow.hd { color: var(--faint); font-size: 10.5px; }

footer.note { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; border-top: 1px solid var(--hair); padding-top: 10px; font-size: 11.5px; color: var(--quiet); }
footer.note p { margin: 0; text-wrap: pretty; }
footer.note b { color: var(--ink2); font-weight: 600; }
.pending { color: var(--faint); font-size: 13px; }

@media (min-width: 1100px) and (min-height: 820px) { .page { min-height: 100vh; align-content: start; } }
@media (max-width: 1099px) { .fig { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } #robot3d .stage { height: 380px; } }
@media (max-width: 720px) {
  header, footer.note { grid-template-columns: 1fr; gap: 14px; }
  .fig { grid-template-columns: 1fr; }
  .viz { height: 190px; }
  .stage { height: 300px; } #robot3d .stage { height: 360px; }
  h1 { font-size: 30px; }
  .top .sp + span { display: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <svg viewBox="-64 -4 128 126.4" role="img" aria-label="Pine"><g fill="#1d1d1f"><path d="M1.05 4.55 C8.01 33.25 19.77 48.88 33.78 55.35 C34.86 55.85 34.70 57.45 33.52 57.65 C24.90 59.05 13.72 61.68 1.57 64.94 C0.54 65.21 -0.55 65.21 -1.58 64.93 C-13.73 61.68 -24.90 59.05 -33.52 57.650 C-34.70 57.45 -34.86 55.85 -33.78 55.35 C-19.77 48.88 -8.01 33.25 -1.05 4.55 C-0.78 3.45 0.78 3.45 1.05 4.55 Z"/><path d="M19.28 68.87 C29.04 92.32 41.73 102.99 55.48 104.89 C56.62 105.04 56.91 106.59 55.85 107.04 C20.16 122.19 -20.18 122.19 -55.87 107.03 C-56.92 106.58 -56.62 105.04 -55.48 104.89 C-41.73 102.98 -29.05 92.32 -19.29 68.88 C-18.80 67.72 -17.57 67.06 -16.36 67.35 C-11.94 68.42 -7.54 69.56 -3.15 70.73 C-1.08 71.28 1.08 71.28 3.15 70.73 C7.54 69.56 11.94 68.42 16.36 67.35 C17.57 67.06 18.80 67.72 19.28 68.87 Z"/></g></svg>
    <b>Pine Engine</b><span>Research preview · October 2026</span><span class="sp"></span><span><a href="details.html">Full write-up</a></span>
  </div>

  <header class="solo">
    <div>
      <h1>High-quality full-body annotated motion data at scale</h1>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <div class="hero">
    <section class="side" id="captured">
      <div class="k">Captured motion<span id="cap-src"></span></div>
      <h3 id="cap-title"></h3>
      <div class="stage" id="st-human" tabindex="0" role="button" aria-label="Pause"><canvas id="cv-human"></canvas></div>
      <div class="traces" id="traces"></div>
      <div class="chips" id="chips"></div>
      <p class="cap" id="cap-left"></p>
    </section>
    <section class="side" id="robot3d">
      <div class="k">Retargeted<span id="rb-src"></span></div>
      <h3 id="rb-title"></h3>
      <div class="stage" id="st-robot" tabindex="0" role="button" aria-label="Pause"></div>
      <p class="cap" id="cap-right"></p>
    </section>
  </div>

  <main class="fig" id="fig">
    <section class="panel"><div class="k"><i>a</i>Coverage</div><h3 id="h-a1"></h3><div class="viz"><div class="bars" id="v-a1"></div></div><p class="cap" id="c-a1"></p></section>
    <section class="panel"><div class="k"><i>b</i>Quality</div><h3 id="h-b1"></h3><div class="viz"><div class="bars" id="v-b1"></div></div><p class="cap" id="c-b1"></p></section>
    <section class="panel"><div class="k"><i>c</i>Annotations, checked</div><h3 id="h-c1"></h3><div class="viz"><div class="labels" id="v-c1"></div></div><p class="cap" id="c-c1"></p></section>
    <section class="panel"><div class="k"><i>d</i>Scaling</div><h3 id="h-c"></h3><div class="viz chart" id="v-c"></div><p class="cap" id="c-c"></p></section>
    <section class="panel"><div class="k"><i>e</i>Data size</div><h3 id="h-d"></h3><div class="viz chart" id="v-d"></div><p class="cap" id="c-d"></p></section>
    <section class="panel"><div class="k"><i>f</i>Generalisation</div><h3 id="h-e"></h3><div class="viz chart" id="v-e"></div><p class="cap" id="c-e"></p></section>
    <section class="panel"><div class="k"><i>g</i>Sensors</div><h3 id="h-f"></h3><div class="viz"><div class="bars" id="v-f"></div></div><p class="cap" id="c-f"></p></section>
    <section class="panel"><div class="k"><i>h</i>Suit to body</div><h3 id="h-g"></h3><div class="viz"><div class="duo"><canvas id="v-g" aria-label="Upper body inferred from leg sensors"></canvas><div class="stack" id="s-g"></div></div></div><p class="cap" id="c-g"></p></section>
    <section class="panel"><div class="k"><i>i</i>Forecast</div><h3 id="h-h"></h3><div class="viz"><div class="bars" id="v-h"></div></div><p class="cap" id="c-h"></p></section>
  </main>

  <footer class="note">
    <p id="method"></p>
    <p id="next"></p>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = (x, d = 0) => Number(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const INK = "#1d1d1f", QUIET = "#86868b", GHOST = "#c7c7cc", HAIR = "#d2d2d7";

/* film: same behaviour as the Pine site */
const video = $("#video") || document.createElement("video"), film = $("#film") || document.createElement("div");
const syncFilm = () => film.setAttribute("aria-label", video.paused ? "Play film" : "Pause film");
film.addEventListener("click", () => (video.paused ? video.play() : video.pause()));
film.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); video.paused ? video.play() : video.pause(); } });
video.addEventListener("play", syncFilm); video.addEventListener("pause", syncFilm);
if (!REDUCE) video.play().catch(syncFilm);

/* ---------------------------------------------------------------- skeleton drawing */
let EDGES = [], KP = {};
const LEGSET = new Set(["pelvis", "l_hip", "r_hip", "l_knee", "r_knee", "l_ankle", "r_ankle", "l_toe", "r_toe"]);
const TRAIL = ["l_wrist", "r_wrist", "l_ankle", "r_ankle"];
let YAW = -0.62, cy = Math.cos(YAW), sy = Math.sin(YAW);
const PITCH = 0.2, cp = Math.cos(PITCH), sp = Math.sin(PITCH);
const setYaw = (a) => { YAW = a; cy = Math.cos(a); sy = Math.sin(a); };

function follow(arr, n) {            // smoothed pelvis track so walkers stay in frame
  const px = new Float32Array(n), py = new Float32Array(n);
  for (let f = 0; f < n; f++) {
    let sx = 0, sy2 = 0, c = 0;
    for (let g = Math.max(0, f - 10); g <= Math.min(n - 1, f + 10); g++) { sx += arr[g * 57]; sy2 += arr[g * 57 + 1]; c++; }
    px[f] = sx / c; py[f] = sy2 / c;
  }
  return { px, py };
}
function P(arr, f, k, ox, oy) {      // world cm -> view (x right, y up) relative to a follow centre
  const i = (f * 19 + k) * 3, x = arr[i] - ox, y = arr[i + 1] - oy, z = arr[i + 2];
  const xr = x * cy - y * sy, yr = x * sy + y * cy;
  return [xr, z * cp + yr * sp];
}
class Figure {
  constructor(canvas, opts) {
    this.c = canvas; this.o = Object.assign({ height: 210, ground: 0.86, center: 0.5 }, opts);
    this.ctx = canvas.getContext("2d"); this.size(); this.layers = []; this.n = 1; this.f = 0;
  }
  size() {
    const r = this.c.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    this.w = Math.max(10, r.width); this.h = Math.max(10, r.height);
    this.c.width = Math.round(this.w * d); this.c.height = Math.round(this.h * d);
    this.ctx.setTransform(d, 0, 0, d, 0, 0);
    this.s = (this.h * this.o.ground * 0.95) / this.o.height;
  }
  set(layers, n, track) { this.layers = layers; this.n = n; this.track = track; this.f = Math.min(this.f, n - 1); }
  xy(v) { return [this.w * this.o.center + v[0] * this.s, this.h * this.o.ground - v[1] * this.s]; }
  draw(f) {
    const g = this.ctx, t = this.track; g.clearRect(0, 0, this.w, this.h);
    const ox = t.px[f], oy = t.py[f];
    // ground: a soft shadow and ticks that move as the body travels
    g.fillStyle = "rgba(0,0,0,0.06)"; g.beginPath();
    g.ellipse(this.w * this.o.center, this.h * this.o.ground + 2, 28 * this.s, 6 * this.s, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = HAIR; g.lineWidth = 1;
    for (let k = -6; k <= 6; k++) {
      const gx = Math.round((ox / 50)) * 50 + k * 50;
      const a = P([gx, oy, 0], 0, 0, ox, oy); const q = this.xy(a);
      g.beginPath(); g.moveTo(q[0], q[1]); g.lineTo(q[0] + 4, q[1]); g.stroke();
    }
    for (const L of this.layers) {
      const arr = L.data, ff = Math.min(f, (arr.length / 57 | 0) - 1);
      if (L.trail) {
        for (const name of TRAIL) {
          const k = KP[name]; g.lineWidth = 1.2;
          for (let b = Math.max(0, ff - 15); b < ff; b++) {
            const p0 = this.xy(P(arr, b, k, ox, oy)), p1 = this.xy(P(arr, b + 1, k, ox, oy));
            g.strokeStyle = `rgba(29,29,31,${(0.32 * (b - ff + 16) / 16).toFixed(3)})`;
            g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
          }
        }
      }
      g.lineCap = "round"; g.lineJoin = "round";
      for (const [a, b] of EDGES) {
        if (L.only && !L.only(a, b)) continue;
        const p = this.xy(P(arr, ff, a, ox, oy)), q = this.xy(P(arr, ff, b, ox, oy));
        g.strokeStyle = L.color; g.lineWidth = L.width; g.setLineDash(L.dash || []);
        g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke();
      }
      g.setLineDash([]);
      if (L.dots) {
        g.fillStyle = L.color;
        for (let k = 0; k < 19; k++) { const p = this.xy(P(arr, ff, k, ox, oy)); g.beginPath(); g.arc(p[0], p[1], L.dots, 0, Math.PI * 2); g.fill(); }
        const h = this.xy(P(arr, ff, KP.head, ox, oy)); g.beginPath(); g.arc(h[0], h[1] - 5 * this.s, 6 * this.s, 0, Math.PI * 2);
        g.strokeStyle = L.color; g.lineWidth = L.width; g.stroke();
      }
    }
    if (this.o.overlay) this.o.overlay(g, f, this);
  }
}

/* one clock for every figure: 20 fps, only while on screen */
const players = new Set(); let last = 0;
function tick(t) {
  if (t - last >= 50) {
    last = t;
    for (const p of players) if (p.visible && !p.paused) { p.fig.f = (p.fig.f + 1) % p.fig.n; p.fig.draw(p.fig.f); }
  }
  requestAnimationFrame(tick);
}
function register(fig, el) {
  const p = { fig, visible: false, paused: REDUCE }; players.add(p);
  new IntersectionObserver((es) => { p.visible = es[0].isIntersecting; }, { rootMargin: "100px" }).observe(el);
  const toggle = () => { p.paused = !p.paused; };
  el.addEventListener("click", toggle);
  el.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
  return p;
}
addEventListener("resize", () => { for (const p of players) { p.fig.size(); p.fig.draw(p.fig.f); } });

/* ---------------------------------------------------------------- charts */
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e); return e;
}
function chart(el, { W, H, x, y, xlog = true, ylog = false, xticks, yticks, xfmt, yfmt, xlabel, ylabel }) {
  W = W || Math.max(280, Math.round(el.clientWidth)); H = H || Math.round(Math.min(300, Math.max(220, W * 0.62)));
  const m = { l: 52, r: 14, t: 12, b: 40 };
  const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, null);
  const sx = (v) => m.l + ((xlog ? Math.log(v) : v) - (xlog ? Math.log(x[0]) : x[0])) / ((xlog ? Math.log(x[1]) : x[1]) - (xlog ? Math.log(x[0]) : x[0])) * (W - m.l - m.r);
  const sy2 = (v) => H - m.b - ((ylog ? Math.log(v) : v) - (ylog ? Math.log(y[0]) : y[0])) / ((ylog ? Math.log(y[1]) : y[1]) - (ylog ? Math.log(y[0]) : y[0])) * (H - m.t - m.b);
  for (const v of yticks) {
    svgEl("line", { x1: m.l, x2: W - m.r, y1: sy2(v), y2: sy2(v), stroke: v === yticks[0] ? HAIR : "#ececf0", "stroke-width": 1 }, s);
    const t = svgEl("text", { x: m.l - 8, y: sy2(v) + 4, "text-anchor": "end" }, s); t.textContent = yfmt(v);
  }

        svgEl("path", { d: path(fp), fill: "none", stroke: QUIET, "stroke-width": 1.1 }, c2.s);
        svgEl("path", { d: path([fp[fp.length - 1], ...xp]), fill: "none", stroke: QUIET, "stroke-width": 1.1, "stroke-dasharray": "3 4" }, c2.s);
      }
      for (const r of dl) { svgEl("circle", { cx: c2.sx(r.train_hours), cy: c2.sy(r.val), r: 3.4, fill: INK }, c2.s); }
      const lt = dl[dl.length - 1]; label(c2, lt.train_hours, lt.val, "all", 7, -6);
    }
    $("#c-d").innerHTML = `${dl.length ? dl[0].size : "2XL"} (${pfmt(dl.length ? dl[0].params : 4.8e6)} parameters) on 1/64, 1/16, 1/4 and all of the hours, same steps, best checkpoint.` +
      (fd ? ` Fit ${fd.form}, β = ${fmt(fd.beta, 2)}.` : "") +
      (dl.length >= 3 ? ` The last 4× of data buys this size only <b>${fmt(100 * (1 - dl[dl.length - 1].val / dl[dl.length - 2].val))}%</b>; the bigger models in panel d turn the same hours into more.` : "");
  } else {
  $("#h-c").innerHTML = `Predicted before training, ${fmt(pr.loss, 4)}. Measured, ${fmt(ob.loss, 4)}.`;
  {
    const c = chart($("#v-c"), { H: 172, x: [6e3, 2e6], y: [0.08, 0.3], ylog: true, xticks: [1e4, 1e5, 1e6], yticks: [0.08, 0.1, 0.15, 0.2, 0.3],
      xfmt: (v) => (v >= 1e6 ? v / 1e6 + "M" : v / 1e3 + "k"), yfmt: (v) => v.toFixed(2), xlabel: "parameters", ylabel: "loss" });
    const law = (n) => fits.model.E + fits.model.A * Math.pow(n, -fits.model.alpha), curve = [];
    for (let n = 8e3; n <= 2e6; n *= 1.08) curve.push([c.sx(n), c.sy(Math.min(0.3, law(n)))]);
    svgEl("path", { d: path(curve), fill: "none", stroke: QUIET, "stroke-width": 1.1 }, c.s);
    svgEl("line", { x1: c.sx(pr.params), x2: c.sx(pr.params), y1: c.sy(pr.lo), y2: c.sy(pr.hi), stroke: INK, "stroke-width": 1.1, "stroke-dasharray": "3 3" }, c.s);
    for (const v of [pr.lo, pr.hi]) svgEl("line", { x1: c.sx(pr.params) - 4, x2: c.sx(pr.params) + 4, y1: c.sy(v), y2: c.sy(v), stroke: INK }, c.s);
    for (const p of fits.model.points) { svgEl("circle", { cx: c.sx(p.params), cy: c.sy(p.loss), r: 3.4, fill: INK }, c.s); label(c, p.params, p.loss, p.size, 6, -6); }
    svgEl("circle", { cx: c.sx(ob.params), cy: c.sy(ob.loss), r: 5.5, fill: "none", stroke: INK, "stroke-width": 1.5 }, c.s);
    label(c, pr.params, pr.lo, `${pr.size}, registered first`, -8, 3, "end");
  }
  $("#c-c").innerHTML = `Fit ${fits.model.form} on four sizes (dots), registered an 80% interval for <b>${pr.size}</b> (dashed), then trained it (ring).`;
  $("#h-d").textContent = "At 12 hours, data is the limit";
  {
    const dp = fits.data.points;
    const c = chart($("#v-d"), { H: 172, x: [0.1, 1000], y: [0.08, 0.3], ylog: true, xticks: [0.1, 1, 10, 100, 1000], yticks: [0.08, 0.1, 0.15, 0.2, 0.3],
      xfmt: (v) => (v < 1 ? v : fmt(v)), yfmt: (v) => v.toFixed(2), xlabel: "hours of training data", ylabel: "loss" });
    const law = (h) => fits.data.E + fits.data.B * Math.pow(h, -fits.data.beta), fp = [], xp = [];
    for (let h = 0.12; h <= 1000; h *= 1.08) (h <= dp[dp.length - 1].hours ? fp : xp).push([c.sx(h), c.sy(law(h))]);
    svgEl("path", { d: path(fp), fill: "none", stroke: QUIET, "stroke-width": 1.1 }, c.s);
    svgEl("path", { d: path([fp[fp.length - 1], ...xp]), fill: "none", stroke: QUIET, "stroke-width": 1.1, "stroke-dasharray": "3 4" }, c.s);
    for (const p of dp) svgEl("circle", { cx: c.sx(p.hours), cy: c.sy(p.loss), r: 3.4, fill: INK }, c.s);
  }
  $("#c-d").innerHTML = `Same model on 1/64 to all of the hours: 1/64 is <b>${fmt(100 * (s64.val.full / S1.val.full - 1))}% worse</b>. Past ${fmt(M.params / 1000)}k parameters, bigger models gain nothing (panel d).`;
  }

  /* e: new people */
  $("#h-e").textContent = `New people score ${fmt(gap, 1)}× worse`;
  {
    const lad = runs.filter((r) => r.fraction === 1).sort((a, b) => a.params - b.params);
    const c = chart($("#v-e"), { H: 172, x: [lad[0].params * 0.7, lad[lad.length - 1].params * 1.4], y: [0.08, 0.6], ylog: true, xticks: lad.map((r) => r.params), yticks: [0.1, 0.2, 0.3, 0.5],
      xfmt: (v) => lad.find((q) => q.params === v).size, yfmt: (v) => v.toFixed(1), xlabel: "model size", ylabel: "loss" });
    const seen = lad.map((r) => [c.sx(r.params), c.sy(r.val.full)]), fresh = lad.map((r) => [c.sx(r.params), c.sy(r.test.full)]);
    svgEl("path", { d: path(fresh), fill: "none", stroke: INK, "stroke-width": 1.3 }, c.s);
    svgEl("path", { d: path(seen), fill: "none", stroke: QUIET, "stroke-width": 1.3 }, c.s);
    for (const p of fresh) svgEl("circle", { cx: p[0], cy: p[1], r: 3, fill: INK }, c.s);
    for (const p of seen) svgEl("circle", { cx: p[0], cy: p[1], r: 3, fill: "#fff", stroke: QUIET, "stroke-width": 1.3 }, c.s);
    const lr = lad[lad.length - 1];
    label(c, lr.params, lr.test.full, "people never seen", -6, -9, "end"); label(c, lr.params, lr.val.full, "new takes, seen people", -6, 15, "end");
  }
  const mir = D.mirror && D.mirror.runs && D.mirror.runs.M;
  $("#c-e").innerHTML = `${GS ? `CPU run, ${fmt(ds.hours, 1)} h. ` : ""}Bigger models barely close the gap to ${fmt(ds.splits_hours.test, 1)} h from <b>people never trained on</b>.` +
    (mir ? ` Doubling to ${fmt(D.mirror.train_hours, 1)} h by mirroring every take moved it by ${fmt(100 * Math.abs(mir.test / mir.base_test - 1), 1)}%: more of the same people does not help; more people should.` : "");

  /* f: sensors */
  $("#h-f").textContent = "Legs carry the signal; arm encoders would help";
  {
    const el = $("#v-f"), mx = ch.nothing_loss / ch.full_loss;
    const rows = [
      ["Everything visible", 1, "ghost"], ["EXO-1: legs + IMU", suitX, ""], ["Legs only", ch.suits[1].loss / ch.full_loss, "light"],
      ["IMU only", ch.suits[2].loss / ch.full_loss, "light"], ["Legs + IMU + arms", armsX, "light"], ["Hide only the legs", hide.legs / ch.full_loss, "light"],
      ["Nothing visible", mx, "ghost"]];
    el.innerHTML = rows.map(([n, v, cls]) => `<div class="brow"><div>${n}</div><div class="t"><span class="${cls}" style="width:${(100 * v / mx).toFixed(1)}%"></span></div><div class="v">${fmt(v, 2)}×</div></div>`).join("");
  }
  $("#c-f").innerHTML = `Model error with only these channels, relative to all 31. The assumed suit is <b>${fmt(suitX, 1)}×</b>; adding arm encoders brings it to <b>${fmt(armsX, 2)}×</b>.`;

  /* g: suit to body */
  $("#h-g").textContent = "From leg sensors, the whole body";
  {
    const fig = new Figure($("#v-g"), { height: 215, ground: 0.9 });
    const legs = (a, b) => LEGSET.has(D.skeleton.keypoints[a]) && LEGSET.has(D.skeleton.keypoints[b]);
    fig.set([{ data: ex.truth_g1, color: GHOST, width: 1.1, only: (a, b) => !legs(a, b) },
             { data: ex.pred_g1, color: INK, width: 1.9, dash: [4, 3], only: (a, b) => !legs(a, b) },
             { data: ex.truth_g1, color: INK, width: 2.2, only: legs }], ex.frames, follow(ex.truth_g1, ex.frames));
    fig.draw(0); register(fig, $("#v-g"));
    $("#s-g").innerHTML = `<div><div class="big num">${fmt(ex.rmse_deg, 1)}°<small>model</small></div><span>error on the ${ex.hidden.length} inferred joints</span></div><div><div class="big num dim">${fmt(ex.meanpose_rmse_deg, 1)}°<small>baseline</small></div><span>guessing the average pose</span></div>`;
  }
  $("#c-g").innerHTML = `Held-out walk. Solid: the ${ex.observed.length} channels a leg suit measures. Dashed: waist and arms inferred by the model. Grey: the truth.`;

  /* h: forecast and the pi-paper pass */
  $("#h-h").textContent = "π0-style chunks halve forecast drift";
  {
    const el = $("#v-h"), rows = [[hold, "ghost", "Hold last pose"], [base, "light", "Original"], [row("resid4"), "light", "Offsets"], [chunk, "", "π0 chunks"], [dct, "", "FAST cosine"]];
    const mx = Math.max(...rows.map((r) => r[0].mean));
    el.innerHTML = `<div class="brow hd"><div>2 s on its own</div><div></div><div class="v" style="color:inherit">error</div></div>` +
      rows.map(([r, cls, n]) => `<div class="brow"><div>${n}</div><div class="t"><span class="${cls}" style="width:${(100 * r.mean / mx).toFixed(1)}%"></span></div><div class="v">${fmt(r.mean, 1)}°</div></div>`).join("");
  }
  const t200 = ro.eval.from_real_frames["200ms"];
  $("#c-h").innerHTML = `Joint error running alone for 2 s, people never seen, same budget each. From real frames the 200 ms forecast beats holding the pose by <b>${fmt(100 * (1 - t200.model_deg / t200.freeze_deg))}%</b>; FAST matches chunks with 62% fewer outputs.`;

  const GPUTXT = GS ? ` The GPU run repeats the pipe on ${fmt(GS.hours)} h (HiPHI ${fmt(GS.per_source.hiphi.hours)} h from ${GS.per_source.hiphi.subjects} performers, mirrored copies left out; Bandai Namco; LAFAN1): IK on the GPU, checked against the NumPy solver (${GS.ik.check.max_mm < 0.001 ? "identical to 0.001 mm" : fmt(GS.ik.check.max_mm, 2) + " mm"}), ${fmt(GS.frames / 1e6, 1)}M frames in ${fmt(GS.ik.seconds)} s; PyTorch in bf16 on one ${D.gpu.gpu || "GPU"}, checked against the NumPy reference (774 checks) before any training; ${fmt(D.gpu.ladder[0].steps)} steps of 512 windows per run (20 epochs). Test takes are held-out takes; held-out performers are scored in phase 2.` : "";
  $("#method").innerHTML = `<b>Method.</b> Every take gets an activity, a style where the source gives one, and a quality grade; every frame gets foot contacts and a locomotion state. BVH takes are mapped to 19 keypoints at 20 fps, quality-checked, and fitted onto Unitree's MJCF by batched inverse kinematics. Each frame becomes 31 channels (23 joints, gravity at the pelvis, turn rate, velocity, height). A causal transformer reads 1.6 s and predicts the next 200 ms, with sensor groups hidden at random during training. Five sizes from 10k to 822k parameters, 900 steps each, hand-written in NumPy on 2 CPU cores, gradients checked numerically. Test takes come from people never trained on. Data: CMU Graphics Lab (free use, no resale) and Bandai Namco Research (CC BY-NC 4.0); robots from unitree_mujoco.${GPUTXT}${GS ? " HiPHI: Noitom Robotics, non-commercial research licence; LAFAN1: Ubisoft La Forge, CC BY-NC-ND 4.0." : ""}`;
  $("#next").innerHTML = GS ? `<b>Running now.</b> Phase 2 on the same pod: whole performers held out of HiPHI and BONES-SEED (522 actors), and the same hours split across 4 to 400 people, to measure whether more people or more hours of the same people improves prediction on someone new; then an 85M-parameter model on everything with the cosine-chunk recipe. <a href="details.html">Full write-up</a>.` : `<b>Next.</b> The same pipe on GPUs: add LAFAN1 (4.6 h) and HiPHI (617 h), train a ladder to tens of millions of parameters with a prediction registered first, and keep the cosine chunks. The question it answers: do bigger models start paying again once there is 50× more data, as panels d to f predict? <a href="details.html">Full write-up</a>.`;
  requestAnimationFrame(tick);
}
})();
