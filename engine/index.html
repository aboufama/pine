<meta name="description" content="460 hours of real people moving, mapped onto a full-size humanoid. Error falls as a power law in hours; at 10 million hours it points to a general full-body action model.">

<style>
/* A paper's project page: one reading column, wide figures, numbered captions. */
:root {
  --ink: #1d1d1f; --ink2: #3a3a3c; --quiet: #6e6e73; --faint: #8e8e93; --ghost: #c7c7cc;
  --hair: #d2d2d7; --wash: #f5f5f7; --paper: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, monospace;
  --col: 680px; --wide: 1120px;
  --gl: max(22px, env(safe-area-inset-left, 0px)); --gr: max(22px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6;
  letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--ghost); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }
.paper { padding: calc(20px + env(safe-area-inset-top, 0px)) var(--gr) calc(56px + env(safe-area-inset-bottom, 0px)) var(--gl); }
.paper > * { max-width: var(--col); margin-left: auto; margin-right: auto; }
.paper > .wide { max-width: var(--wide); }
.paper > .mid { max-width: 820px; }

.top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--quiet); max-width: var(--wide) !important; }
.top svg { width: 16px; height: auto; display: block; }
.top b { color: var(--ink); font-weight: 600; }
.top .sp { flex: 1; }

.masthead { text-align: center; margin-top: 64px; margin-bottom: 36px; max-width: 860px !important; }
.eyebrow { font-size: 13px; color: var(--faint); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(36px, 5.4vw, 64px); line-height: 1.03; letter-spacing: -0.045em; margin: 14px 0 18px; text-wrap: balance; }
.links { font-size: 14px; color: var(--quiet); display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.links a { text-decoration: none; border: 1px solid var(--hair); border-radius: 980px; padding: 5px 14px; color: var(--ink); }
.links a:hover { border-color: var(--ink); }

.abstract { font-size: 19px; line-height: 1.55; color: var(--ink2); margin-bottom: 28px; text-wrap: pretty; }
.abstract b { color: var(--ink); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); margin-bottom: 56px; }
.stats div { padding: 14px 4px; text-align: center; }
.stats div + div { border-left: 1px solid var(--hair); }
.stats b { display: block; font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.15; }
.stats span { font-size: 12.5px; color: var(--quiet); }

h2 { font-family: var(--display); font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em; margin-top: 64px; margin-bottom: 12px; text-wrap: balance; }
p { margin-top: 0; margin-bottom: 16px; text-wrap: pretty; }
p b { font-weight: 600; }

figure { margin-top: 28px; margin-bottom: 0; }
figcaption, .figcap { font-size: 13.5px; line-height: 1.5; color: var(--quiet); margin: 12px auto 36px; max-width: var(--col); text-wrap: pretty; }
figcaption b, .figcap b { color: var(--ink); font-weight: 600; }

/* Figure 1: people */
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 300px 230px; gap: 6px; }
.photos .ph { position: relative; overflow: hidden; border-radius: 10px; background: var(--wash); margin: 0; }
.photos .ph.w { grid-column: span 2; }
.photos .ph.t { grid-row: span 1; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .tag { position: absolute; left: 10px; bottom: 8px; color: #fff; font-size: 11.5px; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,.6); letter-spacing: 0; }

/* Figure 2: robot */
.hero { display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); gap: 6px; }
.side { background: var(--wash); border-radius: 10px; position: relative; overflow: hidden; min-width: 0; }
.side .lab { position: absolute; left: 12px; top: 10px; z-index: 2; font-size: 12px; color: var(--quiet); pointer-events: none; }
.side .lab b { color: var(--ink); font-weight: 600; }
.stage { position: relative; height: 440px; overflow: hidden; cursor: pointer; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#captured .stage { background: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.chips button { font: inherit; font-size: 12.5px; border: 1px solid var(--hair); background: var(--paper); color: var(--ink); border-radius: 980px; padding: 4px 12px; cursor: pointer; letter-spacing: -0.01em; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips button:focus-visible, .stage:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.hidden { display: none !important; }

/* Figure 3: the curve */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--quiet); letter-spacing: 0; }
.chart .lbl { font-family: var(--sans); font-size: 12.5px; fill: var(--ink2); letter-spacing: -0.01em; }
.chart .big { font-family: var(--display); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.02em; }

.fine { font-size: 14px; color: var(--quiet); line-height: 1.55; }
footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--hair); font-size: 12.5px; color: var(--faint); line-height: 1.55; }
footer p { margin-bottom: 8px; }
footer b { color: var(--quiet); font-weight: 600; }
.pending { color: var(--faint); font-size: 13px; }

@media (max-width: 760px) {
  body { font-size: 16px; }
  .masthead { margin-top: 36px; }
  .abstract { font-size: 17px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats div:nth-child(3) { border-left: 0; }
  .stats div:nth-child(n+3) { border-top: 1px solid var(--hair); }
  .photos { grid-template-columns: 1fr 1fr; grid-template-rows: none; grid-auto-rows: 150px; }
  .photos .ph.w { grid-column: span 2; grid-row: span 1; }
  .photos .ph:first-child { grid-row: span 2; }
  .hero { grid-template-columns: 1fr; }
  .stage { height: 330px; }
  h2 { font-size: 22px; margin-top: 48px; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = (x, d = 0) => Number(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const INK = "#1d1d1f", QUIET = "#86868b", GHOST = "#c7c7cc", HAIR = "#d2d2d7";

/* film: same behaviour as the Pine site */
const video = $("#video") || document.createElement("video"), film = $("#film") || document.createElement("div");
const syncFilm = () => film.setAttribute("aria-label", video.paused ? "Play film" : "Pause film");
film.addEventListener("click", () => (video.paused ? video.play() : video.pause()));
film.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); video.paused ? video.play() : video.pause(); } });
video.addEventListener("play", syncFilm); video.addEventListener("pause", syncFilm);
if (!REDUCE) video.play().catch(syncFilm);

/* ---------------------------------------------------------------- skeleton drawing */
let EDGES = [], KP = {};
const LEGSET = new Set(["pelvis", "l_hip", "r_hip", "l_knee", "r_knee", "l_ankle", "r_ankle", "l_toe", "r_toe"]);
const TRAIL = ["l_wrist", "r_wrist", "l_ankle", "r_ankle"];
let YAW = -0.62, cy = Math.cos(YAW), sy = Math.sin(YAW);
const PITCH = 0.2, cp = Math.cos(PITCH), sp = Math.sin(PITCH);
const setYaw = (a) => { YAW = a; cy = Math.cos(a); sy = Math.sin(a); };

function follow(arr, n) {            // smoothed pelvis track so walkers stay in frame
  const px = new Float32Array(n), py = new Float32Array(n);
  for (let f = 0; f < n; f++) {
    let sx = 0, sy2 = 0, c = 0;
    for (let g = Math.max(0, f - 10); g <= Math.min(n - 1, f + 10); g++) { sx += arr[g * 57]; sy2 += arr[g * 57 + 1]; c++; }
    px[f] = sx / c; py[f] = sy2 / c;
  }
  return { px, py };
}
function P(arr, f, k, ox, oy) {      // world cm -> view (x right, y up) relative to a follow centre
  const i = (f * 19 + k) * 3, x = arr[i] - ox, y = arr[i + 1] - oy, z = arr[i + 2];
  const xr = x * cy - y * sy, yr = x * sy + y * cy;
  return [xr, z * cp + yr * sp];
}
class Figure {
  constructor(canvas, opts) {
    this.c = canvas; this.o = Object.assign({ height: 210, ground: 0.86, center: 0.5 }, opts);
    this.ctx = canvas.getContext("2d"); this.size(); this.layers = []; this.n = 1; this.f = 0;
  }
  size() {
    const r = this.c.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    this.w = Math.max(10, r.width); this.h = Math.max(10, r.height);
    this.c.width = Math.round(this.w * d); this.c.height = Math.round(this.h * d);
    this.ctx.setTransform(d, 0, 0, d, 0, 0);
    this.s = (this.h * this.o.ground * 0.95) / this.o.height;
  }
  set(layers, n, track) { this.layers = layers; this.n = n; this.track = track; this.f = Math.min(this.f, n - 1); }
  xy(v) { return [this.w * this.o.center + v[0] * this.s, this.h * this.o.ground - v[1] * this.s]; }
  draw(f) {
    const g = this.ctx, t = this.track; g.clearRect(0, 0, this.w, this.h);
    const ox = t.px[f], oy = t.py[f];
    // ground: a soft shadow and ticks that move as the body travels
    g.fillStyle = "rgba(0,0,0,0.06)"; g.beginPath();
    g.ellipse(this.w * this.o.center, this.h * this.o.ground + 2, 28 * this.s, 6 * this.s, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = HAIR; g.lineWidth = 1;
    for (let k = -6; k <= 6; k++) {
      const gx = Math.round((ox / 50)) * 50 + k * 50;
      const a = P([gx, oy, 0], 0, 0, ox, oy); const q = this.xy(a);
      g.beginPath(); g.moveTo(q[0], q[1]); g.lineTo(q[0] + 4, q[1]); g.stroke();
    }
    for (const L of this.layers) {
      const arr = L.data, ff = Math.min(f, (arr.length / 57 | 0) - 1);
      if (L.trail) {
        for (const name of TRAIL) {
          const k = KP[name]; g.lineWidth = 1.2;
          for (let b = Math.max(0, ff - 15); b < ff; b++) {
            const p0 = this.xy(P(arr, b, k, ox, oy)), p1 = this.xy(P(arr, b + 1, k, ox, oy));
            g.strokeStyle = `rgba(29,29,31,${(0.32 * (b - ff + 16) / 16).toFixed(3)})`;
            g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
          }
        }
      }
      g.lineCap = "round"; g.lineJoin = "round";
      for (const [a, b] of EDGES) {
        if (L.only && !L.only(a, b)) continue;
        const p = this.xy(P(arr, ff, a, ox, oy)), q = this.xy(P(arr, ff, b, ox, oy));
        g.strokeStyle = L.color; g.lineWidth = L.width; g.setLineDash(L.dash || []);
        g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke();
      }
      g.setLineDash([]);
      if (L.dots) {
        g.fillStyle = L.color;
        for (let k = 0; k < 19; k++) { const p = this.xy(P(arr, ff, k, ox, oy)); g.beginPath(); g.arc(p[0], p[1], L.dots, 0, Math.PI * 2); g.fill(); }
        const h = this.xy(P(arr, ff, KP.head, ox, oy)); g.beginPath(); g.arc(h[0], h[1] - 5 * this.s, 6 * this.s, 0, Math.PI * 2);
        g.strokeStyle = L.color; g.lineWidth = L.width; g.stroke();
      }
    }
    if (this.o.overlay) this.o.overlay(g, f, this);
  }
}

/* one clock for every figure: 20 fps, only while on screen */
const players = new Set(); let last = 0;
function tick(t) {
  if (t - last >= 50) {
    last = t;
    for (const p of players) if (p.visible && !p.paused) { p.fig.f = (p.fig.f + 1) % p.fig.n; p.fig.draw(p.fig.f); }
  }
  requestAnimationFrame(tick);
}
function register(fig, el) {
  const p = { fig, visible: false, paused: REDUCE }; players.add(p);
  new IntersectionObserver((es) => { p.visible = es[0].isIntersecting; }, { rootMargin: "100px" }).observe(el);
  const toggle = () => { p.paused = !p.paused; };
  el.addEventListener("click", toggle);
  el.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
  return p;
}
addEventListener("resize", () => { for (const p of players) { p.fig.size(); p.fig.draw(p.fig.f); } });

/* ---------------------------------------------------------------- charts */
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e); return e;
}
function chart(el, { W, H, x, y, xlog = true, ylog = false, xticks, yticks, xfmt, yfmt, xlabel, ylabel }) {
  W = W || Math.max(280, Math.round(el.clientWidth)); H = H || Math.round(Math.min(300, Math.max(220, W * 0.62)));
  const m = { l: 52, r: 14, t: 12, b: 40 };
  const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, null);
  const sx = (v) => m.l + ((xlog ? Math.log(v) : v) - (xlog ? Math.log(x[0]) : x[0])) / ((xlog ? Math.log(x[1]) : x[1]) - (xlog ? Math.log(x[0]) : x[0])) * (W - m.l - m.r);
  const sy2 = (v) => H - m.b - ((ylog ? Math.log(v) : v) - (ylog ? Math.log(y[0]) : y[0])) / ((ylog ? Math.log(y[1]) : y[1]) - (ylog ? Math.log(y[0]) : y[0])) * (H - m.t - m.b);
  for (const v of yticks) {
    svgEl("line", { x1: m.l, x2: W - m.r, y1: sy2(v), y2: sy2(v), stroke: v === yticks[0] ? HAIR : "#ececf0", "stroke-width": 1 }, s);
    const t = svgEl("text", { x: m.l - 8, y: sy2(v) + 4, "text-anchor": "end" }, s); t.textContent = yfmt(v);
  }
  for (const v of xticks) {
    svgEl("line", { x1: sx(v), x2: sx(v), y1: H - m.b, y2: H - m.b + 4, stroke: HAIR }, s);
    const t = svgEl("text", { x: sx(v), y: H - m.b + 17, "text-anchor": "middle" }, s); t.textContent = xfmt(v);
  }
  const xl = svgEl("text", { x: (m.l + W - m.r) / 2, y: H - 6, "text-anchor": "middle", class: "lbl" }, s); xl.textContent = xlabel;
  const yl = svgEl("text", { x: 12, y: (m.t + H - m.b) / 2, "text-anchor": "middle", class: "lbl", transform: `rotate(-90 12 ${(m.t + H - m.b) / 2})` }, s); yl.textContent = ylabel;
  el.appendChild(s);
  return { s, sx, sy: sy2, m, W, H };
}
const path = (pts) => pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
function label(c, xv, yv, txt, dx = 8, dy = 4, anchor = "start", cls = "lbl") {
  const t = svgEl("text", { x: c.sx(xv) + dx, y: c.sy(yv) + dy, "text-anchor": anchor, class: cls }, c.s); t.textContent = txt; return t;
}
function bars(el, rows, max) {
  el.innerHTML = "";
  for (const r of rows) {
    const d = document.createElement("div"); d.className = "brow";
    d.innerHTML = `<div>${r.name}</div><div class="t"><span class="${r.light ? "light" : ""}" style="width:${Math.min(100, 100 * r.value / max).toFixed(1)}%"></span></div><div class="v">${r.text}</div>`;
    el.appendChild(d);
  }
}



Promise.all([fetch("data.json").then((r) => r.json()), fetch("h2.json").then((r) => r.json()), fetch("h2.bin").then((r) => r.arrayBuffer())]).then(([d, m, b]) => render(d, m, b)).catch((e) => {
  document.querySelector("#chart").insertAdjacentHTML("afterbegin", `<p class="pending">The data file did not load (${e}). Reload to try again.</p>`);

      (G.prediction ? ` Before the ${pf(G.prediction.params)} model trained, we registered its score from the smaller ones; it came in within ${fmt(Math.max(1, regOff))}%.` : ""),
    `<b>Ten million hours.</b> Carried forward, the line puts error about <b>${fmt(now[1] / predH)}× below today</b> (80% band ${fmt(now[1] / bandH[1])}–${fmt(now[1] / bandH[0])}×). Ten million hours at 20 frames a second is 720 billion frames, more than the 300 billion tokens GPT-3 was trained on: the scale at which language models first became broadly capable.`,
    `<b>Text in, motion out.</b> Every HiPHI take ships with a written description and BONES-SEED with timed action labels; our pipeline adds activity, style, foot contacts and a quality grade. At ten million hours that is the corpus for a model that turns an instruction into whole-body motion, for any humanoid the solver can reach. That model is what general-purpose humanoids are missing.`,
    `<b>Who can collect it.</b> Error on new people stopped improving with headcount past about a hundred performers and kept improving with hours per person. Ten million hours is roughly <b>5,000 people wearing a suit through a working year</b>. No studio records at that rate; a passive suit worn at work does.`,
  ].map((t) => `<p>${t}</p>`).join("");
  $("#fine").innerHTML = `Figure 3 extrapolates 4.5 orders of magnitude past the data and assumes models keep growing with it, as they did here (${pf(G.ladder[0].params)} to ${pf(top)} parameters). The error is next-200 ms prediction on normalised joint features, not task success on a robot, and no text-conditioned model has been trained yet.` +
    (f8 && d8 ? ` At ${pf(FL.params)} parameters the gain on people never seen was mixed: ${fmt(Math.abs(100 * (1 - f8.from_real_200ms / d8.from_real_200ms)))}% better 200 ms ahead, ${fmt(Math.abs(100 * (f8.execute_8.mean_2s / d8.execute_8.mean_2s - 1)))}% worse over 2 s of running on its own predictions than the ${pf(RD.params)} model.` : "") +
    ` HiPHI and BONES-SEED are licensed for non-commercial research.`;

  $("#method").innerHTML = `<b>Compute.</b> One ${G.gpu || "GPU"}, ${fmt(G.gpu_hours, 1)} GPU hours, about $${fmt(G.cost_usd)}; the PyTorch trainer passed 774 checks against a NumPy reference before any run. Every run, table and caveat is in the <a href="details.html">full write-up</a>.`;
  $("#credits").innerHTML = `<b>Data and images.</b> HiPHI (Noitom Robotics, non-commercial research licence; photos from its demo video), BONES-SEED (Bones Studio; still from its stage video), Bandai Namco Research Motion Dataset (CC BY-NC 4.0; studio photo from its README), LAFAN1 (Ubisoft La Forge, CC BY-NC-ND 4.0). Robot model: unitreerobotics/unitree_mujoco (BSD-3-Clause). Research measurements, not a product claim.`;
  requestAnimationFrame(tick);
}
